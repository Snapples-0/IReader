name: Build iOS IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    # If available in your org plan, prefer `macos-latest-large` for extra RAM headroom.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Tune Gradle for CI
        run: |
          cat >> gradle.properties <<'EOF'
          # iOS/Kotlin-Native linking can OOM on default CI heap sizes.
          org.gradle.jvmargs=-Xmx12g -Dfile.encoding=UTF-8
          kotlin.native.memoryMaxHeap=14g
          org.gradle.parallel=false
          org.gradle.workers.max=1
          # Keep static cache for stability/perf; switch to `none` only if cache-specific errors appear.
          kotlin.native.cacheKind=static
          EOF

      - name: Install CocoaPods
        run: |
          cd iosApp
          pod install

      - name: Clean Gradle build before archive
        run: ./gradlew clean

      - name: Build Xcode Archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/IReader.xcarchive \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            -allowProvisioningUpdates 2>&1 | tee xcodebuild.log

      - name: Export unsigned IPA
        if: success()
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/IReader.xcarchive" -name "*.app" | head -1)
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r IReader-unsigned.ipa Payload

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IReader-unsigned
          path: $RUNNER_TEMP/ipa/IReader-unsigned.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
